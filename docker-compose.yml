services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dar_haccp
      POSTGRES_USER: dar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dar_password}
      TZ: Asia/Riyadh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dar -d dar_haccp"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://dar:${POSTGRES_PASSWORD:-dar_password}@db:5432/dar_haccp
      NODE_ENV: production
    ports:
      - "4000:4000"

volumes:
  pgdata:
