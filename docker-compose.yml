services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dar_haccp
      POSTGRES_USER: dar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dar_password}
      TZ: Asia/Riyadh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dar -d dar_haccp"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://dar:${POSTGRES_PASSWORD:-dar_password}@db:5432/dar_haccp
      NODE_ENV: production
    ports:
      - "4000:4000"

  # Daily compressed backup, 14-day retention (see docs/DISASTER-RECOVERY.md). Copy ./backups off-site.
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-dar_password}
      TZ: Asia/Riyadh
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U dar -d dar_haccp -Fc -f /backups/dar_haccp-$$(date +%F).dump &&
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400;
      done'

volumes:
  pgdata:
